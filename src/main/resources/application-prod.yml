# Perfil de producción (Vercel). Se activa con SPRING_PROFILES_ACTIVE=prod (ya viene en el Dockerfile).

spring:
  datasource:
    # DB_URL / DB_USER / DB_PASSWORD tienen prioridad. Si no existen, se usan las variables
    # que la integración de Neon en Vercel crea sola (PGHOST es el host con pooler).
    # Si faltan ambas, la aplicación no arranca.
    url: ${DB_URL:jdbc:postgresql://${PGHOST}/${PGDATABASE}?sslmode=require}
    username: ${DB_USER:${PGUSER}}
    password: ${DB_PASSWORD:${PGPASSWORD}}
    hikari:
      # Vercel escala instancias a demanda: pocas conexiones por instancia
      # para no agotar el límite de la base de datos (Neon, Supabase…)
      maximum-pool-size: ${DB_POOL_SIZE:3}
      minimum-idle: 0
      idle-timeout: 30000
      max-lifetime: 300000
      connection-timeout: 10000

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  # Vercel está delante como proxy: respeta X-Forwarded-* (https, host)
  forward-headers-strategy: framework
  shutdown: graceful

logging:
  level:
    root: INFO
